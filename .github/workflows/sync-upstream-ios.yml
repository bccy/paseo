# 每天把上游 getpaseo/paseo 的 main 合进 ios-ipa。
#
# - 无冲突：直接 merge 并 push，push 会触发 ios-ipa.yml 自动打包。
# - 有冲突：不碰 ios-ipa，改推一个 sync/upstream-* 分支并开 PR，等人工解决。
#
# 手动运行：Actions → Sync upstream into ios-ipa → Run workflow。

name: Sync upstream into ios-ipa

on:
  schedule:
    - cron: "0 2 * * *" # 10:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-ipa
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "bccy"
          git config user.email "bccy@users.noreply.github.com"

      - name: Fetch upstream main
        run: |
          git remote add upstream https://github.com/getpaseo/paseo.git 2>/dev/null || true
          git fetch --no-tags upstream main

      - name: Already up to date?
        id: check
        run: |
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Try merge
        id: merge
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          if git merge --no-edit FETCH_HEAD; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push ios-ipa when merged cleanly
        if: steps.merge.outputs.merged == 'true'
        run: git push origin HEAD:ios-ipa

      - name: Open PR when conflicted
        if: steps.merge.outputs.merged == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="sync/upstream-$(date -u +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"
          git merge --no-commit --no-ff FETCH_HEAD || true
          # GITHUB_TOKEN 不能推送 workflow 文件，所以上游带进来的 workflow 一律丢弃，
          # 保留本仓库自己的（`workflows` 权限只对 PAT 开放）。
          git checkout HEAD -- .github/workflows/ 2>/dev/null || true
          git clean -fd .github/workflows/ 2>/dev/null || true
          git add -u
          git add $(git ls-files --others --exclude-standard) 2>/dev/null || true
          git commit -m "wip: merge upstream main into ios-ipa (conflicts need resolution)" || true
          git push origin "$BRANCH"
          # 建 PR 需要仓库开启 "Allow GitHub Actions to create and approve pull requests"；
          # 没开时退化为只推分支并打印链接，不让整次同步失败。
          # 用 REST 而不是 gh pr create：fork 仓库里 GraphQL 的 createPullRequest
          # 常被判为 integration 越权，REST 的权限检查相对宽松。
          gh api "repos/${{ github.repository }}/pulls" -X POST \
            -f title="同步上游 main（有冲突，需手动解决）" \
            -f head="$BRANCH" \
            -f base="ios-ipa" \
            -f body="自动把 getpaseo/paseo 的 main 合进 ios-ipa 时产生冲突。解决冲突并合并后，ios-ipa 的 push 会自动触发打包。" \
          || echo "::warning::无法自动创建 PR，请手动打开 https://github.com/bccy/paseo/pull/new/$BRANCH"
