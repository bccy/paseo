# 从源码构建 iOS ipa。
# 默认用仓库 Secrets 里的 ad-hoc 证书签好；手动触发时把 sign 选成 unsigned 可出未签名包。
#
# 需要的 Secrets：
#   IOS_CERT_P12_BASE64   Apple Distribution 证书 .p12 的 base64
#   IOS_CERT_PASSWORD     该 p12 的密码
#   IOS_PROFILE_BASE64    .mobileprovision 的 base64
#   IOS_KEYCHAIN_PASSWORD CI 临时钥匙串密码（任意）
#
# 硬约束：描述文件授权的 App ID 必须等于 BUNDLE_ID，且只能安装到描述文件里登记的设备。

name: iOS ipa

on:
  push:
    branches: [ios-ipa]
  workflow_dispatch:
    inputs:
      sign:
        description: "signed = 用证书签好；unsigned = 只出未签名包"
        required: false
        default: "signed"

env:
  BUNDLE_ID: tg.tgqq3913.tool8
  TEAM_ID: PG48F9N3AJ

jobs:
  build:
    runs-on: macos-26          # Xcode 26.x；避开 Xcode 27 的 UIScene 启动崩溃
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app deps
        run: npm run build:app-deps

      - name: Point bundle id at the certificate's App ID
        if: inputs.sign != 'unsigned'
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const p = "packages/app/app.config.js";
            const before = fs.readFileSync(p, "utf8");
            const after = before.replace(
              /(production:\s*\{[\s\S]*?packageId:\s*)"sh\.paseo"/,
              (m, head) => head + JSON.stringify(process.env.BUNDLE_ID)
            );
            if (after === before) throw new Error("未替换到 production.packageId");
            fs.writeFileSync(p, after);
          '
          grep -n 'packageId' packages/app/app.config.js

      - name: Prebuild iOS project (runs pod install)
        working-directory: packages/app
        run: npx expo prebuild --platform ios --clean --non-interactive

      - name: Import certificate and provisioning profile
        if: inputs.sign != 'unsigned'
        env:
          CERT_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          printf '%s' "$CERT_BASE64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          printf '%s' "$PROFILE_BASE64" | base64 --decode -o "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "--- 可用签名身份 ---"
          security find-identity -v -p codesigning

          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          TEAM_IN_PROFILE=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          echo "profile=$PROFILE_NAME uuid=$PROFILE_UUID app=$APP_ID team=$TEAM_IN_PROFILE"

          if [ "$APP_ID" != "$TEAM_ID.$BUNDLE_ID" ]; then
            echo "::error::描述文件授权 $APP_ID，而 bundle id 是 $TEAM_ID.$BUNDLE_ID，签名必然失败"
            exit 1
          fi
          if [ "$TEAM_IN_PROFILE" != "$TEAM_ID" ]; then
            echo "::error::描述文件 Team 是 $TEAM_IN_PROFILE，与配置的 $TEAM_ID 不符"
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Archive (signed, manual signing)
        if: inputs.sign != 'unsigned'
        working-directory: packages/app
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          # 主 target 名 = 工程名。workspace 的 schemes 里排第一的是 Pods 的库，不能取 [0]。
          SCHEME=$(basename "$(ls -d ios/*.xcodeproj | head -1)" .xcodeproj)
          xcodebuild -workspace "$WORKSPACE" -list -json \
            | python3 -c 'import json,sys; print("\n".join(json.load(sys.stdin)["workspace"]["schemes"]))' > /tmp/schemes.txt
          if ! grep -qx "$SCHEME" /tmp/schemes.txt; then
            echo "::error::scheme $SCHEME 不在列表里"; cat /tmp/schemes.txt; exit 1
          fi
          echo "workspace=$WORKSPACE scheme=$SCHEME profile=$PROFILE_NAME"
          xcodebuild archive \
            -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/Paseo.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Export ad-hoc ipa
        if: inputs.sign != 'unsigned'
        working-directory: packages/app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib
          opts = {
              "method": "release-testing",   # Xcode 15+ 里 Ad Hoc 的新名字
              "teamID": os.environ["TEAM_ID"],
              "signingStyle": "manual",
              "stripSwiftSymbols": True,
              "provisioningProfiles": {os.environ["BUNDLE_ID"]: os.environ["PROFILE_NAME"]},
          }
          os.makedirs("build", exist_ok=True)
          with open("build/ExportOptions.plist", "wb") as f:
              plistlib.dump(opts, f)
          print(opts)
          PY
          xcodebuild -exportArchive \
            -archivePath build/Paseo.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/ipa
          ls -la build/ipa

          IPA=$(find build/ipa -name '*.ipa' | head -1)
          test -n "$IPA" || { echo "::error::没有导出 ipa"; exit 1; }
          rm -rf /tmp/verify && mkdir -p /tmp/verify && unzip -q "$IPA" -d /tmp/verify
          APP=$(find /tmp/verify/Payload -maxdepth 1 -name '*.app' | head -1)
          echo "--- 签名校验 ---"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E "Identifier=|TeamIdentifier=|Authority=|Signature=" || true
          test -f "$APP/embedded.mobileprovision" || { echo "::error::缺 embedded.mobileprovision"; exit 1; }
          echo "--- entitlements ---"
          codesign -d --entitlements :- "$APP" 2>/dev/null | plutil -p - 2>/dev/null | head -20 || true
          mkdir -p /tmp/out && cp "$IPA" /tmp/out/

      - name: xcodebuild (unsigned)
        if: inputs.sign == 'unsigned'
        working-directory: packages/app
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$(ls -d ios/*.xcodeproj | head -1)" .xcodeproj)
          xcodebuild build \
            -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" EXPANDED_CODE_SIGN_IDENTITY=""

      - name: Pack unsigned ipa
        if: inputs.sign == 'unsigned'
        working-directory: packages/app
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products -maxdepth 3 -name '*.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "::error::找不到 .app 产物，Products 目录内容："
            find build/Build/Products -maxdepth 2 | head -40
            exit 1
          fi
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Paseo-unsigned.ipa Payload
          mkdir -p /tmp/out && cp Paseo-unsigned.ipa /tmp/out/
          ls -la /tmp/out

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: paseo-ios-ipa
          path: /tmp/out/*.ipa
          if-no-files-found: error
          retention-days: 30
