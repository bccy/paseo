# 从源码构建「未签名」iOS ipa，签名由使用者自行完成（Sideloadly / AltStore / 自签脚本等）。
# 触发：向本分支 push 自动构建；也可在 Actions 页手动 Run workflow。
# 产物：artifact `paseo-ios-ipa` 里的 Paseo-unsigned.ipa
# 说明：默认保留上游 bundle id `sh.paseo`；自签时若你的 App ID 不同，可在手动触发时用 bundle_id 覆盖，
#       或直接用自签工具的“修改 bundle id”功能。

name: iOS unsigned ipa

on:
  push:
    branches: [ios-ipa]
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "可选：覆盖 bundle id（留空则保留上游 sh.paseo）"
        required: false
        default: ""

jobs:
  build:
    runs-on: macos-26          # Xcode 26.x；避开 Xcode 27 的 UIScene 启动崩溃
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app deps
        run: npm run build:app-deps

      - name: Override bundle id (optional)
        if: ${{ inputs.bundle_id != '' }}
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const p = "packages/app/app.config.js";
            const before = fs.readFileSync(p, "utf8");
            const after = before.replace(
              /(production:\s*\{[\s\S]*?packageId:\s*)"sh\.paseo"/,
              (m, head) => head + JSON.stringify(process.env.BUNDLE_ID)
            );
            if (after === before) throw new Error("未替换到 production.packageId");
            fs.writeFileSync(p, after);
          '
          grep -n 'packageId' packages/app/app.config.js

      - name: Prebuild iOS project (runs pod install)
        working-directory: packages/app
        run: npx expo prebuild --platform ios --clean --non-interactive

      - name: xcodebuild (unsigned)
        working-directory: packages/app
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["workspace"]["schemes"][0])')
          echo "workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild build \
            -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" EXPANDED_CODE_SIGN_IDENTITY=""

      - name: Pack unsigned ipa
        working-directory: packages/app
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products -maxdepth 2 -name '*.app' -type d | head -1)
          echo "app=$APP"
          test -x "$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")" \
            || { echo "可执行文件缺失"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          rm -rf Payload Paseo-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Paseo-unsigned.ipa Payload
          ls -la Paseo-unsigned.ipa
          unzip -l Paseo-unsigned.ipa | head -5

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: paseo-ios-ipa
          path: packages/app/Paseo-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
