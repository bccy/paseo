# 从源码构建 iOS ipa（未签名），签名在本地完成。
# 触发：push 到本分支自动构建；也可在 Actions 页手动 Run。
# 产物：artifact `paseo-ios-ipa` 里的 Paseo-unsigned.ipa
#
# bundle id 保持上游原值 sh.paseo。两个 backport 补丁（expo-image-picker 17.0.10 /
# expo-image-manipulator 14.0.8）由 `npm ci` 的 postinstall 通过 patches/ 自动应用，
# 不需要在此步骤做任何事。

name: iOS unsigned ipa

on:
  push:
    branches: [ios-ipa]
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "可选：覆盖 bundle id（留空保持 sh.paseo）"
        required: false
        default: ""

jobs:
  build:
    runs-on: macos-26          # Xcode 26.x；避开 Xcode 27 的 UIScene 启动崩溃
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies (applies patches/ via postinstall)
        run: npm ci

      - name: Build app deps
        run: npm run build:app-deps

      - name: Override bundle id (optional)
        if: ${{ inputs.bundle_id != '' }}
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const p = "packages/app/app.config.js";
            const before = fs.readFileSync(p, "utf8");
            const after = before.replace(
              /(production:\s*\{[\s\S]*?packageId:\s*)"sh\.paseo"/,
              (m, head) => head + JSON.stringify(process.env.BUNDLE_ID)
            );
            if (after === before) throw new Error("未替换到 production.packageId");
            fs.writeFileSync(p, after);
          '
          grep -n 'packageId' packages/app/app.config.js

      - name: Prebuild iOS project (runs pod install)
        working-directory: packages/app
        run: npx expo prebuild --platform ios --clean --non-interactive

      - name: xcodebuild (unsigned)
        working-directory: packages/app
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          # 主 target 名 = 工程名。workspace 的 schemes 里排第一的是 Pods 的库，不能取 [0]。
          SCHEME=$(basename "$(ls -d ios/*.xcodeproj | head -1)" .xcodeproj)
          echo "workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild build \
            -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" EXPANDED_CODE_SIGN_IDENTITY=""

      - name: Pack unsigned ipa
        working-directory: packages/app
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products -maxdepth 3 -name '*.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "::error::找不到 .app 产物，Products 目录内容："
            find build/Build/Products -maxdepth 2 | head -40
            exit 1
          fi
          echo "app=$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          rm -rf Payload Paseo-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Paseo-unsigned.ipa Payload
          ls -la Paseo-unsigned.ipa
          unzip -l Paseo-unsigned.ipa | head -5

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: paseo-ios-ipa
          path: packages/app/Paseo-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
