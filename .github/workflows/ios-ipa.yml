# 用你自己的 App ID + 签名证书，从源码构建可安装的 iOS ipa。
# 需要先在这个仓库配好 4 个 Secrets（见 README 段落 / 对话说明）：
#   IOS_CERT_P12_BASE64      开发者证书 .p12 的 base64
#   IOS_CERT_PASSWORD        该 p12 的密码
#   IOS_PROFILE_BASE64       .mobileprovision 的 base64
#   IOS_KEYCHAIN_PASSWORD    临时钥匙串密码（随便设，仅 CI 内使用）
# 注意：bundle_id 必须与 provisioning profile 中的 App ID 完全一致；
#       profile 需包含 Push Notifications 能力（expo-notifications 会写 aps-environment）。

name: iOS signed ipa

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "自己的 App ID（必须和 mobileprovision 里的 bundle id 一致）"
        required: true
        default: "com.bccy.paseo"
      export_method:
        description: "导出方式（按证书类型选）"
        required: true
        default: "ad-hoc"
        type: choice
        options:
          - ad-hoc
          - development
          - app-store

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app deps
        run: npm run build:app-deps

      - name: Patch bundle id into app.config.js
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const p = "packages/app/app.config.js";
            const before = fs.readFileSync(p, "utf8");
            const after = before.replace(
              /(production:\s*\{[\s\S]*?packageId:\s*)"sh\.paseo"/,
              (m, head) => head + JSON.stringify(process.env.BUNDLE_ID)
            );
            if (after === before) throw new Error("未替换到 production.packageId，app.config.js 结构可能变了");
            fs.writeFileSync(p, after);
            console.log("bundle id ->", process.env.BUNDLE_ID);
          '
          grep -n 'packageId' packages/app/app.config.js

      - name: Prebuild iOS project (runs pod install)
        working-directory: packages/app
        run: npx expo prebuild --platform ios --clean --non-interactive

      - name: Install signing materials
        env:
          CERT_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          printf '%s' "$CERT_BASE64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          printf '%s' "$PROFILE_BASE64" | base64 --decode -o "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning

          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          echo "profile=$PROFILE_NAME uuid=$PROFILE_UUID team=$TEAM_ID app=$APP_ID"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          {
            echo "PROFILE_NAME=$PROFILE_NAME"
            echo "TEAM_ID=$TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Archive (manual signing)
        working-directory: packages/app
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["workspace"]["schemes"][0])')
          echo "workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/Paseo.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      - name: Export ipa
        working-directory: packages/app
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
          EXPORT_METHOD: ${{ inputs.export_method }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib
          opts = {
              "method": os.environ["EXPORT_METHOD"],
              "teamID": os.environ["TEAM_ID"],
              "signingStyle": "manual",
              "stripSwiftSymbols": True,
              "compileBitcode": False,
              "provisioningProfiles": {os.environ["BUNDLE_ID"]: os.environ["PROFILE_NAME"]},
          }
          os.makedirs("build", exist_ok=True)
          with open("build/ExportOptions.plist", "wb") as f:
              plistlib.dump(opts, f)
          PY
          xcodebuild -exportArchive \
            -archivePath build/Paseo.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/ipa

      - name: Collect ipa
        working-directory: packages/app
        run: |
          set -euo pipefail
          ls -la build/ipa
          mkdir -p /tmp/out
          find build/ipa -name '*.ipa' -exec cp {} /tmp/out/ \;
          ls -la /tmp/out

      - uses: actions/upload-artifact@v4
        with:
          name: paseo-ios-ipa
          path: /tmp/out/*.ipa
          if-no-files-found: error
